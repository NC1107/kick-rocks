name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # A mail server that accepts mail for every domain and never relays it, for the mail tests.
      greenmail:
        image: greenmail/standalone:2.1.5
        ports:
          - 3025:3025
          - 3143:3143
        env:
          GREENMAIL_OPTS: >-
            -Dgreenmail.setup.test.smtp
            -Dgreenmail.setup.test.imap
            -Dgreenmail.hostname=0.0.0.0
            -Dgreenmail.auth.disabled
    env:
      GREENMAIL_HOST: localhost
      GREENMAIL_SMTP_PORT: "3025"
      GREENMAIL_IMAP_PORT: "3143"
      # An integration test skips itself when its service is missing, which is right on a laptop
      # and wrong here: this makes every such skip a failure.
      KICKROCKS_REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for the recipe runner tests
        run: pnpm --filter @kickrocks/recipes exec playwright install --with-deps chromium
      - name: Wait for GreenMail
        run: timeout 60 bash -c 'until nc -z localhost 3025 && nc -z localhost 3143; do sleep 1; done'
      - run: pnpm lint
      - run: pnpm data:build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # A Dockerfile that misses a package or a broken `pnpm deploy` would otherwise merge green and
  # break ./install.sh for every new user.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile worker --profile agent build

  # Production pulls these tags and Watchtower redeploys on a new :latest, so only a push to main
  # that passed every check above publishes. The sha tag is the rollback handle.
  publish:
    needs: [check, images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    strategy:
      matrix:
        include:
          - image: kick-rocks-server
            dockerfile: Dockerfile
          - image: kick-rocks-worker
            dockerfile: apps/worker/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          tags: |
            ghcr.io/nc1107/${{ matrix.image }}:latest
            ghcr.io/nc1107/${{ matrix.image }}:${{ github.sha }}
