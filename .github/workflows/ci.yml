name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # A mail server that accepts mail for every domain and never relays it, for the mail tests.
      greenmail:
        image: greenmail/standalone:2.1.5
        ports:
          - 3025:3025
          - 3143:3143
        env:
          GREENMAIL_OPTS: >-
            -Dgreenmail.setup.test.smtp
            -Dgreenmail.setup.test.imap
            -Dgreenmail.hostname=0.0.0.0
            -Dgreenmail.auth.disabled
    env:
      GREENMAIL_HOST: localhost
      GREENMAIL_SMTP_PORT: "3025"
      GREENMAIL_IMAP_PORT: "3143"
      # An integration test skips itself when its service is missing, which is right on a laptop
      # and wrong here: this makes every such skip a failure.
      KICKROCKS_REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for the recipe runner tests
        # apt mirrors on the runner occasionally hang; fail fast so a retry is cheap instead of a stalled deploy.
        timeout-minutes: 10
        run: pnpm --filter @kickrocks/recipes exec playwright install --with-deps chromium
      - name: Wait for GreenMail
        run: timeout 60 bash -c 'until nc -z localhost 3025 && nc -z localhost 3143; do sleep 1; done'
      - run: pnpm lint
      - name: Check standards
        env:
          STANDARDS_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: pnpm standards
      - run: pnpm data:build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # A Dockerfile that misses a package or a broken `pnpm deploy` would otherwise merge green and
  # break ./install.sh for every new user.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build every image without the reply model
        run: docker compose --profile worker --profile agent build
      - name: Build the server image with the reply model bundled
        # A real release when one is pinned, else a stand-in archive on this machine, so the
        # download, the digest check, the copy and the pruning of other platforms are exercised
        # either way.
        run: |
          pin=apps/server/reply-model/release.json
          url="$(jq -r .url "$pin")"
          sha="$(jq -r .tarSha256 "$pin")"
          if [ -z "$url" ] || [ -z "$sha" ]; then
            mkdir -p "$RUNNER_TEMP/stub/files" "$RUNNER_TEMP/stub/serve"
            echo '{}' > "$RUNNER_TEMP/stub/files/manifest.json"
            tar -cf "$RUNNER_TEMP/stub/serve/reply-model.tar" -C "$RUNNER_TEMP/stub/files" manifest.json
            sha="$(sha256sum "$RUNNER_TEMP/stub/serve/reply-model.tar" | cut -d' ' -f1)"
            (cd "$RUNNER_TEMP/stub/serve" && python3 -m http.server 8123 --bind 127.0.0.1 &)
            sleep 2
            url="http://127.0.0.1:8123/reply-model.tar"
          fi
          docker build --network=host \
            --build-arg REPLY_MODEL=bundled \
            --build-arg "REPLY_MODEL_URL=$url" \
            --build-arg "REPLY_MODEL_SHA256=$sha" \
            -t kickrocks-server:bundled .
          docker run --rm --entrypoint sh kickrocks-server:bundled -c 'test -f /app/reply-model/manifest.json && ls /app/server/node_modules/.pnpm | grep -c onnxruntime-node'

  # The model is a release asset pinned by digest. This checks that the dev replies are still the
  # ones it was trained on, and that the pinned file answers the golden texts the same way through
  # the server's own runtime.
  reply-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm data:build
      - name: The dev replies match the pinned model's training data
        run: |
          if [ -n "$(jq -r .dataSha256 apps/server/reply-model/release.json)" ]; then
            pnpm --filter @kickrocks/server reply-model:check-data
          else
            echo "No release is pinned yet."
          fi
      - name: Restore the pinned release
        id: pin
        run: |
          echo "url=$(jq -r .url apps/server/reply-model/release.json)" >> "$GITHUB_OUTPUT"
          echo "sha=$(jq -r .tarSha256 apps/server/reply-model/release.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: steps.pin.outputs.url != ''
        id: asset
        with:
          path: ${{ runner.temp }}/reply-model.tar
          key: reply-model-${{ steps.pin.outputs.sha }}
      - name: Fetch the pinned release
        if: steps.pin.outputs.url != '' && steps.asset.outputs.cache-hit != 'true'
        run: curl -fsSL "${{ steps.pin.outputs.url }}" -o "$RUNNER_TEMP/reply-model.tar"
      - name: Check the digest and unpack
        if: steps.pin.outputs.url != ''
        run: |
          echo "${{ steps.pin.outputs.sha }}  $RUNNER_TEMP/reply-model.tar" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/reply-model" && tar -xf "$RUNNER_TEMP/reply-model.tar" -C "$RUNNER_TEMP/reply-model"
      - name: Answer the golden texts through the server's runtime
        if: steps.pin.outputs.url != ''
        run: pnpm --filter @kickrocks/server reply-model:verify --dir "$RUNNER_TEMP/reply-model"
      - name: Run the bench candidate that uses the server's runtime
        if: steps.pin.outputs.url != ''
        run: |
          curl -fsSL "$(echo "${{ steps.pin.outputs.url }}" | sed 's#/[^/]*$#/dev-oof.json#')" -o "$RUNNER_TEMP/reply-model/dev-oof.json"
          REPLY_MODEL_RELEASE_DIR="$RUNNER_TEMP/reply-model" pnpm --filter @kickrocks/server bench:replies --candidates rules,c-encoder-node --out "$RUNNER_TEMP/bench"

  # Production pulls these tags and Watchtower redeploys on a new :latest, so only a push to main
  # that passed every check above publishes. The sha tag is the rollback handle.
  publish:
    needs: [check, images, reply-model]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    strategy:
      matrix:
        include:
          - image: kick-rocks-server
            dockerfile: Dockerfile
          - image: kick-rocks-worker
            dockerfile: apps/worker/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Read the pinned reply model
        id: model
        run: |
          pin=apps/server/reply-model/release.json
          url="$(jq -r .url "$pin")"
          sha="$(jq -r .tarSha256 "$pin")"
          if [ -n "$url" ] && [ -n "$sha" ]; then
            {
              echo "args<<EOF"
              echo "REPLY_MODEL=bundled"
              echo "REPLY_MODEL_URL=$url"
              echo "REPLY_MODEL_SHA256=$sha"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "args=REPLY_MODEL=none" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ steps.model.outputs.args }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          tags: |
            ghcr.io/nc1107/${{ matrix.image }}:latest
            ghcr.io/nc1107/${{ matrix.image }}:${{ github.sha }}
