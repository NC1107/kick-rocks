<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Opt out of the Quickfind directory</title><link rel="stylesheet" href="/site.css"></head>
<body>
<header class="site"><a class="brand" href="/">Quickfind</a><nav><a href="/about">About</a><a href="/help">Help</a><a href="/privacy">Privacy</a></nav></header>
<main>
  <h1>Remove my listing</h1>
  <p class="lede">Quickfind lists public information about people. Fill in this form and we will take your listing down within 72 hours.</p>
  <form method="post" action="/optout">
    <label for="first">First name</label>
    <input id="first" name="first_name" type="text" required autocomplete="given-name">
    <label for="last">Last name</label>
    <input id="last" name="last_name" type="text" required autocomplete="family-name">
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" required autocomplete="email">
    <div style="position:absolute;left:-9999px" aria-hidden="true"><label for="hp">Leave this empty</label><input id="hp" name="website" type="text" tabindex="-1"></div>
    <button class="primary" type="submit">Submit removal request</button>
  </form>
</main>
<footer class="site"><a href="/terms">Terms</a><a href="/privacy">Privacy</a><a href="/contact">Contact</a><p>2026 Quickfind Directory Inc.</p></footer>
</body>
</html>
