<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Remove a record - Recordwatch</title><link rel="stylesheet" href="/site.css"></head>
<body>
<header class="site"><a class="brand" href="/">Recordwatch</a></header>
<main>
  <h1>Remove a record</h1>
  <p class="lede">Enter the email address where we can reach you. We will send a message there that you must confirm before the record is removed.</p>
  <form method="post" action="/remove">
    <input type="hidden" name="id" value="4c8e1f">
    <label for="email">Your email address</label>
    <input id="email" name="email" type="email" required>
    <button class="primary" type="submit">Send removal request</button>
  </form>
</main>
</body>
</html>
