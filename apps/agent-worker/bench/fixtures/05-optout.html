<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Opt out - Lookup Hub</title><link rel="stylesheet" href="/site.css">
<style>
.hc[hidden] { display: none; }
fieldset.hc { padding: 0; min-width: 0; }
.hc .hc-legend { padding: 6px 14px 0; font-size: 12px; color: #6b7686; }
.hc { border: 1px solid #c4cad4; border-radius: 6px; width: 320px; background: #fafbfc; margin: 18px 0; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.hc .hc-head { padding: 10px 14px; background: #4a6fd3; color: #fff; font-size: 14px; }
.hc .hc-head strong { display: block; font-size: 17px; }
.hc .hc-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 6px; }
.hc .hc-grid button { height: 84px; border: 0; background: linear-gradient(135deg, #8a9aa8, #5d6b78); cursor: pointer; }
.hc .hc-grid button[aria-pressed=true] { outline: 4px solid #4a6fd3; }
.hc .hc-foot { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-top: 1px solid #dde1e8; font-size: 12px; color: #6b7686; }
</style></head>
<body>
<header class="site"><a class="brand" href="/">Lookup Hub</a><nav><a href="/search">Search</a><a href="/privacy">Privacy</a></nav></header>
<main>
  <h1>Opt out of Lookup Hub</h1>
  <p class="lede">Tell us who you are and we will stop showing your profile.</p>
  <form method="post" action="/optout">
    <label for="first">First name</label>
    <input id="first" name="first_name" type="text" required>
    <label for="last">Last name</label>
    <input id="last" name="last_name" type="text" required>
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" required>

    <fieldset class="h-captcha hc" id="hcaptcha" hidden>
      <legend class="hc-legend">Security check</legend>
      <div class="hc-head"><strong>Select all squares with traffic lights</strong></div>
      <div class="hc-grid">
        <button type="button" aria-pressed="false" aria-label="Square 1"></button><button type="button" aria-pressed="false" aria-label="Square 2"></button><button type="button" aria-pressed="false" aria-label="Square 3"></button>
        <button type="button" aria-pressed="false" aria-label="Square 4"></button><button type="button" aria-pressed="false" aria-label="Square 5"></button><button type="button" aria-pressed="false" aria-label="Square 6"></button>
        <button type="button" aria-pressed="false" aria-label="Square 7"></button><button type="button" aria-pressed="false" aria-label="Square 8"></button><button type="button" aria-pressed="false" aria-label="Square 9"></button>
      </div>
      <div class="hc-foot"><span>If there are none, click Skip</span><button type="button" class="secondary" id="verify">Verify</button></div>
    </fieldset>

    <button class="primary" type="submit" id="send">Submit opt-out request</button>
  </form>
</main>
<script>
document.getElementById("email").addEventListener("input", () => {
  document.getElementById("hcaptcha").hidden = false;
});
document.querySelectorAll(".hc-grid button").forEach((b) => {
  b.addEventListener("click", () => { b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") === "true" ? "false" : "true"); });
});
</script>
</body>
</html>
