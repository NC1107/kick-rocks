<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Find your listing - Findaperson</title><link rel="stylesheet" href="/site.css"></head>
<body>
<header class="site"><a class="brand" href="/">Findaperson</a><nav><a href="/about">About</a><a href="/privacy">Privacy</a></nav></header>
<main>
  <h1>Find your listing</h1>
  <p class="lede">To opt out, first search for your listing. When you find it, select Remove this listing.</p>
  <form method="get" action="/listings">
    <label for="first">First name</label>
    <input id="first" name="first" type="text" required>
    <label for="last">Last name</label>
    <input id="last" name="last" type="text" required>
    <label for="city">City</label>
    <input id="city" name="city" type="text">
    <label for="state">State</label>
    <select id="state" name="state">
      <option value="">Any state</option>
      <option value="CA">California</option>
      <option value="TX">Texas</option>
      <option value="NY">New York</option>
      <option value="WA">Washington</option>
    </select>
    <button class="primary" type="submit">Search listings</button>
  </form>
</main>
</body>
</html>
