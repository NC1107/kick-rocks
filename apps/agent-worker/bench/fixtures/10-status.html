<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Opt-out status - Dataharbor</title><link rel="stylesheet" href="/site.css"></head>
<body>
<header class="site"><a class="brand" href="/">Dataharbor</a><nav><a href="/about">About</a><a href="/privacy">Privacy</a></nav></header>
<main>
  <h1>Opt out of Dataharbor</h1>
  <p class="lede">Enter the email address on your request to look up its status, or start a new request.</p>
  <form method="get" action="/status">
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" required>
    <button class="primary" type="submit">Check status</button>
  </form>
  <h2>Start a new request</h2>
  <form method="post" action="/optout">
    <label for="first">First name</label>
    <input id="first" name="first_name" type="text" required>
    <label for="last">Last name</label>
    <input id="last" name="last_name" type="text" required>
    <label for="email2">Email address</label>
    <input id="email2" name="email" type="email" required>
    <button class="primary" type="submit">Submit new request</button>
  </form>
</main>
</body>
</html>
