<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Request form - Fixture Broker</title></head>
<body>
<h1>Tell us about yourself</h1>
<p>Most of our members live in Austin, TX, and the rest across Texas and Oregon (OR).</p>
<form method="post" action="/optout">
  <label for="month">Month</label>
  <select id="month" name="dob_month">
    <option value="">Month</option>
    <option value="1">January</option><option value="2">February</option><option value="3">March</option>
    <option value="4">April</option><option value="5">May</option><option value="6">June</option>
    <option value="7">July</option><option value="8">August</option><option value="9">September</option>
    <option value="10">October</option><option value="11">November</option><option value="12">December</option>
  </select>
  <label for="state">Your state</label>
  <select id="state" name="region">
    <option value="">Choose a state</option>
    <option value="TX">Texas</option>
    <option value="CA">California</option>
    <option value="OR">Oregon</option>
  </select>
  <label for="topic">What is this about</label>
  <select id="topic" name="topic">
    <option value="">Choose</option>
    <option value="sale">Sale of my data</option>
    <option value="delete">Deletion</option>
  </select>
  <label for="residence">Residence state, if you prefer to type it</label>
  <input id="residence" name="residence">
  <button type="submit">Submit request</button>
</form>
</body>
</html>
