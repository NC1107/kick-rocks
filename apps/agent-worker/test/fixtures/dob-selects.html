<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Request form - Fixture Broker</title></head>
<body>
<h1>Date of birth</h1>
<form method="post" action="/optout">
  <label for="month">Month</label>
  <select id="month" name="m">
    <option value="">Month</option>
    <option value="1">January</option><option value="2">February</option><option value="3">March</option>
    <option value="4">April</option><option value="5">May</option><option value="6">June</option>
    <option value="7">July</option><option value="8">August</option><option value="9">September</option>
    <option value="10">October</option><option value="11">November</option><option value="12">December</option>
  </select>
  <label for="day">Day</label>
  <select id="day" name="d"></select>
  <label for="year">Year</label>
  <select id="year" name="y"></select>
</form>
<script>
  const fill = (id, label, from, to) => {
    const select = document.getElementById(id);
    select.add(new Option(label, ""));
    for (let n = from; n <= to; n++) select.add(new Option(String(n), String(n)));
  };
  fill("day", "Day", 1, 31);
  fill("year", "Year", 1930, 2005);
</script>
</body>
</html>
