<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Request - Fixture Broker</title></head>
<body>
<main>
<h1>Make a request</h1>
<span id="kind-label">Kind of request</span>
<button type="button" id="kind" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="kind-label">Delete my data</button>
<button type="button" role="combobox" aria-expanded="true" aria-label="Product">Search app</button>
<button type="button" aria-haspopup="listbox">Pick a plan</button>
<div role="listbox" tabindex="0" aria-label="Plans">
  <div role="option" tabindex="-1" aria-selected="true">Free</div>
  <div role="option" tabindex="-1" aria-selected="false">Paid</div>
</div>
<div role="tablist"><button type="button" role="tab" aria-selected="true">Overview</button><button type="button" role="tab" aria-selected="false">Details</button></div>
</main>
</body>
</html>
