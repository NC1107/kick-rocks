<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Opt out - Beacon</title></head>
<body>
<h1>Remove your listing</h1>
<form method="post" action="/gate-optout">
  <label for="email">Email address</label>
  <input id="email" name="email" type="email">
  <button type="submit">Submit request</button>
</form>
<script>
  const field = document.getElementById('email');
  const body = () => 'email=' + encodeURIComponent(field.value);
  addEventListener('pagehide', () => navigator.sendBeacon('/gate-beacon-post', body()));
  field.addEventListener('change', () => setTimeout(() => fetch('/gate-late-post', { method: 'POST', body: body() }), 600));
</script>
</body>
</html>
