<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Opt out - Delayed submit</title></head>
<body>
<h1>Remove your listing</h1>
<form method="post" action="/gate-optout">
  <label for="email">Email address</label>
  <input id="email" name="email" type="email"
         onchange="const f = this.form; setTimeout(() => f.submit(), 1500)">
  <button type="submit">Submit request</button>
</form>
</body>
</html>
