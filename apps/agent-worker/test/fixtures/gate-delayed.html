<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Opt out - Delayed</title></head>
<body>
<h1>Remove your listing</h1>
<form method="post" action="/gate-optout">
  <label for="email">Email address</label>
  <input id="email" name="email" type="email"
         onchange="const f = this.form; setTimeout(() => fetch('/gate-autosave', { method: 'POST', body: new URLSearchParams(new FormData(f)) }), 1500)">
  <button type="submit">Submit request</button>
</form>
</body>
</html>
