<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Opt out - GET</title></head>
<body>
<h1>Remove your listing</h1>
<form method="post" action="/gate-optout">
  <label for="email">Email address</label>
  <input id="email" name="email" type="email"
         onchange="fetch('/gate-collect?via=fetch&amp;email=' + encodeURIComponent(this.value)); new Image().src = '/gate-collect?via=image&amp;email=' + encodeURIComponent(this.value);">
  <button type="submit">Submit request</button>
</form>
</body>
</html>
