<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Partner frame</title></head>
<body>
<p>A frame of the target's second host that sends what the page gives it.</p>
<script>
  addEventListener('message', (event) => {
    navigator.sendBeacon('/gate-v-ka-frame', 'e=' + encodeURIComponent(String(event.data)));
  });
</script>
</body>
</html>
