<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Opt out - Mutate</title></head>
<body>
<h1>Remove your listing</h1>
<form method="post" action="/gate-optout" id="form">
  <label for="email">Email address</label>
  <input id="email" name="email" type="email">
  <input type="hidden" id="note" name="note" value="static">
  <button type="submit">Submit request</button>
</form>
<script>
  document.getElementById('form').addEventListener('submit', () => {
    const email = document.getElementById('email');
    document.getElementById('note').value = 'at-' + Date.now();
    email.value = email.value + '.' + Math.random().toString(36).slice(2, 6);
  });
</script>
</body>
</html>
