<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Opt out - Many fields</title></head>
<body>
<h1>Remove your listing</h1>
<form id="form" method="post" action="/gate-optout">
  <label for="email">Email address</label>
  <input id="email" name="email" type="email">
  <div id="padding"></div>
  <button type="submit">Submit request</button>
</form>
<script>
  const padding = document.getElementById("padding");
  for (let index = 0; index < 399; index += 1) {
    const input = document.createElement("input");
    input.type = "hidden";
    input.name = `pad${index}`;
    input.value = "1";
    padding.append(input);
  }
  if (location.hash === "#phone") {
    const label = document.createElement("label");
    label.htmlFor = "phone";
    label.textContent = "Phone number";
    const input = document.createElement("input");
    input.id = "phone";
    input.name = "phone";
    input.type = "tel";
    document.getElementById("form").append(label, input);
  }
</script>
</body>
</html>
