<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Opt out - Referer</title></head>
<body>
<h1>Remove your listing</h1>
<form method="post" action="/gate-optout">
  <label for="email">Email address</label>
  <input id="email" name="email" type="email">
  <button type="submit">Submit request</button>
</form>
<script>
  const field = document.getElementById('email');
  field.addEventListener('change', () => {
    history.replaceState({}, '', '/gate-typed?e=' + encodeURIComponent(field.value));
    new Image().src = '/gate-pixel?x=1';
  });
</script>
</body>
</html>
