<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Opt out - Document rules</title>
<script type="speculationrules">
{"prefetch":[{"where":{"href_matches":"/*"},"eagerness":"immediate"}],"prerender":[{"where":{"href_matches":"/*"},"eagerness":"immediate"}]}
</script>
</head>
<body>
<h1>Remove your listing</h1>
<label for="email">Email address</label>
<input id="email" name="email" type="email">
<a id="go" href="/gate-landing">Continue</a>
<script>
  const field = document.getElementById('email');
  field.addEventListener('change', () => {
    document.getElementById('go').href = '/gate-landing?e=' + encodeURIComponent(field.value);
  });
</script>
</body>
