<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Opt out - Preloading</title></head>
<body>
<h1>Remove your listing</h1>
<label for="email">Email address</label>
<input id="email" name="email" type="email">
<a id="go" href="/gate-landing">Continue</a>
<script>
  const field = document.getElementById('email');
  field.addEventListener('change', () => {
    const address = '/gate-landing?e=' + encodeURIComponent(field.value);
    const rules = document.createElement('script');
    rules.type = 'speculationrules';
    rules.textContent = JSON.stringify({ prerender: [{ source: 'list', urls: [address], eagerness: 'immediate' }] });
    document.head.append(rules);
  });
</script>
</body>
</html>
