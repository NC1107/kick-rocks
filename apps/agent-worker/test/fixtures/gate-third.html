<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Opt out - Third party</title></head>
<body>
<h1>Remove your listing</h1>
<form method="post" action="/gate-optout">
  <label for="email">Email address</label>
  <input id="email" name="email" type="email"
         onchange="new Image().src = '{{OTHER}}/gate-pixel?x=1'">
  <button type="submit">Submit request</button>
</form>
</body>
</html>
