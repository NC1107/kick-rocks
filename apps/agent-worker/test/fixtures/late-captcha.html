<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Opt out - Fixture Broker</title></head>
<body>
<h1>Remove your listing</h1>
<form method="post" action="/optout">
  <label for="email">Email address</label>
  <input id="email" name="email" type="email" required>
  <label for="state">State</label>
  <select id="state" name="state">
    <option value="">Choose a state</option>
    <option value="TX">Texas</option>
  </select>
  <div id="widget" class="h-captcha" style="display:none">Select all squares with traffic lights</div>
  <button type="submit">Submit request</button>
</form>
<script>
  const show = () => { document.getElementById("widget").style.display = "block"; };
  const trigger = new URLSearchParams(location.search).get("on") || "email";
  if (trigger === "email") document.getElementById("email").addEventListener("input", show);
  if (trigger === "state") document.getElementById("state").addEventListener("change", show);
</script>
</body>
</html>
