<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Long page - Fixture Broker</title></head>
<body>
<h1>Our newsroom</h1>
<div id="stories"></div>
<form method="post" action="/optout">
  <label for="email">Email address</label>
  <input id="email" name="email" type="email" required>
  <button type="submit">Submit request</button>
</form>
<script>
  const stories = document.getElementById("stories");
  for (let i = 0; i < 240; i++) {
    const p = document.createElement("p");
    p.textContent = `Story ${i}: what changed this week and why it matters to readers everywhere.`;
    stories.appendChild(p);
  }
</script>
</body>
</html>
