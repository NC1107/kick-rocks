name: kick-rocks

services:
  server:
    build: .
    image: kickrocks/server:dev
    restart: unless-stopped
    ports:
      # Loopback by default, because the first-run setup page is open until a password is set.
      - "${KICKROCKS_BIND_ADDRESS:-127.0.0.1}:${KICKROCKS_HOST_PORT:-8420}:8420"
    volumes:
      # A named volume so the container's unprivileged user owns it from the start.
      # A bind mount works too if you chown the host directory to uid 1000 first.
      - kickrocks-data:/data
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Empty values count as unset. A worker token turns the worker API on.
      KICKROCKS_WORKER_TOKEN: ${KICKROCKS_WORKER_TOKEN:-}
      KICKROCKS_PUBLIC_URL: ${KICKROCKS_PUBLIC_URL:-}
      KICKROCKS_TRUST_PROXY: ${KICKROCKS_TRUST_PROXY:-}
      KICKROCKS_ALLOWED_HOSTS: ${KICKROCKS_ALLOWED_HOSTS:-}
    # The workers wait for this, so they do not log failed heartbeats while the server starts.
    # The request goes to loopback inside the container, which the host check always accepts.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:8420/api/health").then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))'
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  # The browser worker. It needs the same KICKROCKS_WORKER_TOKEN as the server, so it only starts
  # when the worker profile is on. install.sh writes COMPOSE_PROFILES=worker to .env, so every
  # compose command sees it, stops it, and removes it; without that line a plain
  # `docker compose up` starts the server alone and keeps working without a token.
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: kickrocks/worker:dev
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      KICKROCKS_SERVER_URL: http://server:8420
      KICKROCKS_WORKER_TOKEN: ${KICKROCKS_WORKER_TOKEN:-}
      # Cookies and logins survive restarts, which keeps bot checks from treating every run as new.
      # Each Kick Rocks profile gets its own browser folder under it, so brokers cannot link people.
      KICKROCKS_CHROME_PROFILE: /profile
    volumes:
      - kickrocks-chrome:/profile
    # Chrome crashes on the 64 MB default shared memory of a container.
    shm_size: 1gb
    # The worker waits up to 20 seconds on shutdown before it closes Chrome and releases its task,
    # so Docker must not send SIGKILL at its default 10 seconds.
    stop_grace_period: 30s
    # The browser opens pages from broker sites and links from inbound email, so it keeps no
    # capability and cannot gain one.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    profiles:
      - worker

  # An optional worker that lets a model take the agent tasks no recipe covers: a local model through
  # Ollama or any OpenAI-compatible endpoint, or the Anthropic API. It starts only with
  # the agent profile (add it to COMPOSE_PROFILES in .env), needs KICKROCKS_AGENT_MODEL (and an API key for a hosted
  # model), and keeps its own Chrome profile because two browsers cannot share one.
  agent-worker:
    build:
      context: .
      dockerfile: apps/agent-worker/Dockerfile
    image: kickrocks/agent-worker:dev
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      KICKROCKS_SERVER_URL: http://server:8420
      KICKROCKS_WORKER_TOKEN: ${KICKROCKS_WORKER_TOKEN:-}
      KICKROCKS_WORKER_ID: ${KICKROCKS_AGENT_WORKER_ID:-}
      KICKROCKS_CHROME_PROFILE: /profile
      KICKROCKS_AGENT_PROVIDER: ${KICKROCKS_AGENT_PROVIDER:-openai}
      KICKROCKS_AGENT_MODEL: ${KICKROCKS_AGENT_MODEL:-}
      # Inside the container localhost is the container, so Ollama on this machine is reached as
      # http://host.docker.internal:11434 (with /v1 for the openai provider). Empty means the
      # provider's own default.
      KICKROCKS_AGENT_BASE_URL: ${KICKROCKS_AGENT_BASE_URL:-}
      KICKROCKS_AGENT_API_KEY: ${KICKROCKS_AGENT_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      KICKROCKS_AGENT_MAX_STEPS: ${KICKROCKS_AGENT_MAX_STEPS:-}
      KICKROCKS_AGENT_MAX_MINUTES: ${KICKROCKS_AGENT_MAX_MINUTES:-}
      KICKROCKS_AGENT_MAX_TOTAL_TOKENS: ${KICKROCKS_AGENT_MAX_TOTAL_TOKENS:-}
      KICKROCKS_AGENT_MAX_OUTPUT_TOKENS: ${KICKROCKS_AGENT_MAX_OUTPUT_TOKENS:-}
      KICKROCKS_AGENT_TOKEN_PARAM: ${KICKROCKS_AGENT_TOKEN_PARAM:-}
      KICKROCKS_AGENT_NUM_CTX: ${KICKROCKS_AGENT_NUM_CTX:-}
      KICKROCKS_AGENT_THINKING: ${KICKROCKS_AGENT_THINKING:-}
      KICKROCKS_WORKER_PACE: ${KICKROCKS_WORKER_PACE:-}
      KICKROCKS_AGENT_INPUT_USD_PER_MTOK: ${KICKROCKS_AGENT_INPUT_USD_PER_MTOK:-}
      KICKROCKS_AGENT_OUTPUT_USD_PER_MTOK: ${KICKROCKS_AGENT_OUTPUT_USD_PER_MTOK:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - kickrocks-agent-chrome:/profile
    # Chrome crashes on the 64 MB default shared memory of a container.
    shm_size: 1gb
    # Same shutdown grace as the recipe worker: it releases its task before it closes Chrome.
    stop_grace_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    profiles:
      - agent

volumes:
  kickrocks-data:
  kickrocks-chrome:
  kickrocks-agent-chrome:
