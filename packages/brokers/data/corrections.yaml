# Fixes to imported broker records that were checked by hand against the broker's own pages.
# They apply to every imported list before the lists merge, because an imported record always wins
# over curated-brokers.yaml. Each entry names the pages it was read from and the day it was checked.
# `pnpm data:build` fails when an entry matches no record or changes none of the records it matches,
# so drop an entry once its upstream list carries the fix.
corrections:
  - domain: thebridgecorp.com
    set:
      email: privacy@thebridgecorp.com
      privacy_rights_url: https://www.thebridgecorp.com/california-residents-ccpa/
    source_urls:
      - https://www.thebridgecorp.com/privacy-policy/
      - https://www.thebridgecorp.com/california-residents-ccpa/
    checked: 2026-10-07
    note: 'Eraser lists a named person. The privacy policy and the CCPA page name privacy@thebridgecorp.com, and the 2026 California registry lists the same address for OWMN, LTD.'

  - domain: choreograph.com
    set:
      email: privacy@choreograph.com
      privacy_rights_url: https://www.choreograph.com/ccpa
    source_urls:
      - https://www.choreograph.com/ccpa
      - https://www.choreograph.com/global-privacy-policy/global-privacy-policy-english
    checked: 2026-10-07
    note: 'Eraser lists a named person. The CCPA page also names DoNotMail@Choreograph.com and the 2026 registry names datagovernance@choreograph.com; privacy@ is the general address. The page loads on choreograph.com without a trailing slash, and with one it redirects to a staging host.'

  - domain: mlxp.com
    set:
      website: https://mailinglists.com
      email: privacy@mailinglists.com
    source_urls:
      - https://mailinglists.com/about/privacy-policy
    checked: 2026-10-07
    note: 'mlxp.com redirects to mailinglists.com. The privacy policy of Infinite Media Concepts, Inc. (d/b/a MailingLists.com, last updated 2026-07-01) lists privacy@mailinglists.com. The record keeps its own domain so it never merges into the infinite-media-concepts target.'

  - domain: plug-industries.com
    set:
      email: blakehogan@plug-industries.com
      privacy_rights_url: null
    source_urls:
      - https://cppa.ca.gov/data_broker_registry/registry.csv
    checked: 2026-10-07
    note: 'The 2026 California registry lists a named person as the only official contact. The /opt-out and /privacy-policy pages on plug-industries.com no longer exist, and the registry''s rights page is the home page, so there is no form to send people to.'

  - domain: nctue.com
    set:
      email: admin@nctue.com
      privacy_rights_url: https://nctue.com/consumer/
    source_urls:
      - https://nctue.com/privacy-policy/
      - https://nctue.com/consumer/
    checked: 2026-10-07
    note: 'Eraser lists an address on an unrelated domain. admin@nctue.com is the only address on nctue.com and its privacy policy, and consumer disclosure and dispute requests go through the consumer page.'

  - domain: foursquare.com
    set:
      email: privacy@foursquare.com
    source_urls:
      - https://foursquare.com/legal/privacy-center/foursquare-privacy-policy-consumer-services/
    checked: 2026-10-07
    note: 'Eraser lists legal@. The consumer privacy policy names privacy@foursquare.com for questions to its Data Protection Officer. The 2026 registry lists privacyteam@foursquare.com instead.'

  - domain: peoplefinders.com
    set:
      category: people-search
    source_urls:
      - https://www.peoplefinders.com/
      - https://www.peoplefinders.com/opt-out
    checked: 2026-10-07
    note: 'Only the 2026 California registry lists it, so it was filed as a registered broker and its campaign never scanned it. The site is a people-search site: a name, state and city search lists records, and the opt-out form asks for the same identifiers. The scan recipe ran end to end on 2026-10-07 and returned candidates.'

  - domain: acxiom.com
    set:
      category: marketing
    source_urls:
      - https://www.acxiom.com/optout/
    checked: 2026-10-08
    note: 'BADBOOL files it under people search, but its own entry says it is hard to find your info for free, and Acxiom publishes no listing a person can find and point at. A scan-first removal would never find a record and the request would stall.'

  - domain: zoominfo.com
    set:
      category: marketing
    source_urls:
      - https://privacyrequest.zoominfo.com/remove/verify
    checked: 2026-10-08
    note: 'BADBOOL files it under people search. Its removal form checks whether an email is on record and then sends a code, and there is no listing to find and point at, so a scan-first removal would stall.'

  - domain: classmates.com
    set:
      category: marketing
    source_urls:
      - https://help.classmates.com/hc/en-us/articles/115002224171-How-can-I-cancel-my-membership-
    checked: 2026-10-08
    note: 'BADBOOL files it under people search, but its entry only describes cancelling a membership. There is no public listing to find and point at, so a scan-first removal would stall.'

  - domain: facecheck.id
    set:
      category: requires-id
    source_urls:
      - https://facecheck.id/Face-Search/RemoveMyPhotos
    checked: 2026-10-08
    note: 'BADBOOL files it under people search without an ID marker. Removal means uploading an image and a driver''s license, an ID card or a selfie, so it belongs with the sites that ask for ID.'

  - domain: lightcast.io
    set:
      email: null
    source_urls:
      - https://github.com/drumandbytes/eraser/blob/29bd7bb60a96cfb87eb84e65fd4f0a434860511e/data/brokers.yaml
    checked: 2026-10-08
    note: 'Eraser lists legal@lightcast.io for it, and its note says the privacy request form is the required removal path instead of email, as a user report and not a reply from the broker. The 2026 California registry lists an address as well. The correction clears the address on both lists, so the request goes to the opt-out form.'

  - domain: mobilewalla.com
    set:
      opt_out_url: null
      add_requirements: [device_id]
    source_urls:
      - https://github.com/drumandbytes/eraser/blob/29bd7bb60a96cfb87eb84e65fd4f0a434860511e/data/brokers.yaml
    checked: 2026-10-08
    note: 'The pinned Eraser note records that the opt-out form takes only a mobile advertising or device identifier, which Kick Rocks does not hold, so the form route is one the agent can never complete. The device_id flag makes the planner skip the broker as unsupported, and keeps a rights page from making it a form.'
  - domain: outlogic.io
