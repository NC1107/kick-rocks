# A broker whose own reply, or a hard bounce, says email is not the way in. The addresses another list
# carries for the domain are withheld from the merge, so the request goes to the form instead.
# Without `address` every address is withheld, which is right when the broker refused email as a channel.
# With `address` only that address is withheld, which is right when one mailbox bounced and the rest
# were never tried. `pnpm data:build` fails when an entry withholds nothing, so drop it once it is moot.
email_refused:
  - domain: nielsen.com
    source_urls:
      - https://github.com/drumandbytes/eraser/blob/29bd7bb60a96cfb87eb84e65fd4f0a434860511e/data/brokers.yaml
    checked: 2026-10-08
    note: 'The pinned Eraser note records a reply that sends privacy requests to a form, portal or phone line instead of email, so another list''s address would send the request where the broker said it is not handled.'

